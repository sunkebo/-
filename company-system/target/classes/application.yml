server:
  port: 8088

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/company_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 20040303..
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        characterSetResults: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.company.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh-CN

# JWT配置
jwt:
  secret: company-system-jwt-secret-key-2024-very-long-secret-key-for-security
  expiration: 86400000  # 24小时

# 系统初始管理员账号
system:
  admin:
    username: admin
    password: admin123
